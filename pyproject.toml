[project]
name = "pelican-jev"
version = "0.1.0"
description = "A Jev-directed Logo turtle draws a pelican riding a bicycle"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
